<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpLab | Analytics Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #09090b;
            --bg-card: #18181b;
            --bg-sidebar: #0f0f12;
            --border: #27272a;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --font-sans: 'Inter', sans-serif;
            --sidebar-width: 240px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-main); color: var(--text-primary); font-family: var(--font-sans); display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar { width: var(--sidebar-width); background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 1.5rem 0; position: fixed; height: 100vh; }
        .sidebar-logo { padding: 0 1.5rem 2rem; font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
        .sidebar-logo img { height: 24px; border-radius: 4px; }
        .sidebar-section { margin-bottom: 1.5rem; }
        .sidebar-title { padding: 0 1.5rem 0.5rem; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.05em; }
        .sidebar-item { padding: 0.5rem 1.5rem; display: flex; align-items: center; gap: 0.75rem; color: var(--text-secondary); font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
        .sidebar-item:hover { background: rgba(255,255,255,0.05); color: var(--text-primary); }
        .sidebar-item.active { background: rgba(59,130,246,0.1); color: var(--accent-blue); border-right: 2px solid var(--accent-blue); }

        /* Main */
        .main { flex: 1; margin-left: var(--sidebar-width); display: flex; flex-direction: column; }
        .top-nav { height: 60px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; position: sticky; top: 0; background: var(--bg-main); z-index: 10; }
        .nav-left, .nav-right { display: flex; align-items: center; gap: 0.75rem; }
        .domain-selector { background: var(--bg-card); border: 1px solid var(--border); padding: 0.4rem 0.75rem; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }
        .btn-small { background: transparent; border: 1px solid var(--border); color: var(--text-primary); padding: 0.4rem 0.75rem; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }
        .time-range { color: var(--text-secondary); font-size: 0.85rem; }

        .content { padding: 1.5rem; max-width: 1200px; width: 100%; margin: 0 auto; }
        .filter-bar { margin-bottom: 1.5rem; }

        /* KPI */
        .kpi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
        .kpi-card { background: var(--bg-card); border: 1px solid var(--border); padding: 1.25rem; border-radius: 10px; }
        .kpi-label { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.4rem; }
        .kpi-value { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
        .kpi-delta { font-size: 0.7rem; font-weight: 600; display: flex; align-items: center; gap: 0.2rem; }
        .up { color: var(--accent-green); } .down { color: var(--accent-red); }

        /* Chart */
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; margin-bottom: 1.5rem; }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .chart-placeholder { height: 250px; width: 100%; border-bottom: 1px solid var(--border); display: flex; align-items: flex-end; padding-bottom: 10px; }
        .chart-line { width: 100%; height: 2px; background: var(--accent-blue); opacity: 0.3; }

        /* Table */
        .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
        .tab { padding: 0.75rem 1.25rem; font-size: 0.85rem; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; }
        .tab.active { color: var(--text-primary); border-bottom-color: var(--accent-blue); }
        .empty { padding: 3rem; text-align: center; color: var(--text-secondary); font-size: 0.9rem; }

        @media (max-width: 1024px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 640px) { .sidebar { display: none; } .main { margin-left: 0; } .kpi-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-logo"><img src="logo.png" alt="ExpLab"> ExpLab</div>
        <div class="sidebar-section">
            <div class="sidebar-title">Traffic</div>
            <div class="sidebar-item active"><i class="fas fa-chart-line"></i> Overview</div>
            <div class="sidebar-item"><i class="fas fa-mouse-pointer"></i> Events</div>
            <div class="sidebar-item"><i class="fas fa-user-clock"></i> Sessions</div>
            <div class="sidebar-item"><i class="fas fa-bolt"></i> Realtime</div>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-title">Behavior</div>
            <div class="sidebar-item"><i class="fas fa-bullseye"></i> Goals</div>
            <div class="sidebar-item"><i class="fas fa-filter"></i> Funnels</div>
        </div>
    </aside>

    <main class="main">
        <header class="top-nav">
            <div class="nav-left">
                <div class="domain-selector">anasfarah.com <i class="fas fa-chevron-down" style="font-size:0.7rem"></i></div>
                <button class="btn-small">Share</button>
                <button class="btn-small">Edit</button>
            </div>
            <div class="nav-right">
                <div class="time-range">Last 24 hours <i class="fas fa-chevron-down" style="font-size:0.7rem"></i></div>
            </div>
        </header>

        <div class="content">
            <div class="filter-bar"><button class="btn-small"><i class="fas fa-filter"></i> Filter</button></div>

            <div class="kpi-grid">
                <div class="kpi-card"><div class="kpi-label">Visitors</div><div class="kpi-value">0</div><div class="kpi-delta up">0% <i class="fas fa-arrow-up"></i></div></div>
                <div class="kpi-card"><div class="kpi-label">Visits</div><div class="kpi-value">0</div><div class="kpi-delta up">0% <i class="fas fa-arrow-up"></i></div></div>
                <div class="kpi-card"><div class="kpi-label">Views</div><div class="kpi-value">0</div><div class="kpi-delta up">0% <i class="fas fa-arrow-up"></i></div></div>
                <div class="kpi-card"><div class="kpi-label">Bounce Rate</div><div class="kpi-value">0%</div><div class="kpi-delta down">0% <i class="fas fa-arrow-down"></i></div></div>
                <div class="kpi-card"><div class="kpi-label">Visit Duration</div><div class="kpi-value">0s</div><div class="kpi-delta up">0% <i class="fas fa-arrow-up"></i></div></div>
            </div>

            <div class="card">
                <div class="chart-header">
                    <div style="font-weight:600">Traffic</div>
                    <div style="font-size:0.8rem; color:var(--text-secondary)">Visitors &bull; Views</div>
                </div>
                <div class="chart-placeholder"><div class="chart-line"></div></div>
            </div>

            <div class="card" style="padding:0">
                <div class="tabs">
                    <div class="tab active">Path</div>
                    <div class="tab">Entry</div>
                    <div class="tab">Exit</div>
                </div>
                <div class="empty">No data available</div>
            </div>
        </div>
    </main>

    <script>
        document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            t.classList.add('active');
        }));
        document.querySelectorAll('.sidebar-item').forEach(i => i.addEventListener('click', () => {
            document.querySelectorAll('.sidebar-item').forEach(x => x.classList.remove('active'));
            i.classList.add('active');
        }));
    </script>
</body>
</html>
